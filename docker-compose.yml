services:
  ansflow-frontend:
    build: .
    image: ansflow-frontend:v1.7.0
    container_name: ansflow-frontend
    ports:
      - "3000:80"
    restart: always
    environment:
      - NODE_ENV=production
    volumes:
      - ansflow-media:/usr/share/nginx/media/:ro
    networks:
      - ansflow-network

volumes:
  ansflow-media:
    external: true

networks:
  ansflow-network:
    name: ansflow-common-network
    external: true
